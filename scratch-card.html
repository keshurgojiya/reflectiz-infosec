<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch & Win | Reflectiz × Infosecurity Europe</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(122.88deg, #103A77 26.52%, #FF6C87 115.97%);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Mobile-only logo header ── */
    .mobile-header {
      display: none;
    }
    .mobile-header img { height: 60px; width: auto; }

    /* ── Card container ── */
    .card-wrap {
      position: relative;
      width: 100%;
      max-width: 1100px;
    }

    /* ── Background SVG image (desktop) ── */
    .card-bg {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* ── Scratch zone (positioned over center of card) ── */
    .scratch-zone {
      position: absolute;
      /* Cookie (334px) is centered in the 871px wide SVG card */
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      /* 334/871 = 38.35% of card width */
      width: 38%;
      aspect-ratio: 1 / 1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* ── Reveal layer (prize shown underneath cookie) ── */
    .reveal-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
      top: 18%;
      height: 100%;
    }
    .reveal-layer img {
      width: 100%;
    }

    /* ── Canvas (cookie image drawn here, scratched away) ── */
    #scratch-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      height: 100%;
      top: 18%;
    }

    /* ── Page transition overlay ── */
    .overlay {
      position: fixed; inset: 0;
      background: #0d1545;
      opacity: 0; pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 100;
    }
    .overlay.active { opacity: 1; pointer-events: all; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      body { justify-content: flex-start; padding-top: 30px; gap: 0; }

      .mobile-header { display: block; }

      /* Hide desktop card background on mobile */
      .card-bg { display: none; }

      /* On mobile: scratch zone becomes a standalone element */
      .card-wrap {
        width: auto;
        max-width: none;
      }
      .scratch-zone {
        position: static;
        transform: none;
        width: 280px;
        height: 280px;
        aspect-ratio: unset;
      }
    }
  </style>
</head>
<body>

  <!-- Logo shown only on mobile (desktop logo is inside card-bg SVG) -->
  <header class="mobile-header">
    <img src="./assets/logos.svg" alt="Reflectiz × Infosecurity Europe">
  </header>

  <div class="card-wrap">
    <!-- Desktop: background card with logos + monster -->
    <img class="card-bg" src="./assets/card-background.svg" alt="">

    <!-- Scratch card: cookie image on canvas, prize reveal underneath -->
    <div class="scratch-zone" id="scratchZone">
      <div class="reveal-layer">
        <img src="assets/Coockie-scratching.svg" alt="">
      </div>
      <canvas id="scratch-canvas"></canvas>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <script>
    // ── URL params ─────────────────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    if (!params.get('token')) params.set('token', 'test-' + Math.random().toString(36).slice(2, 10));
    if (!params.get('prize')) params.set('prize', 'duck');

    // ── Canvas + cookie image ──────────────────────────────────────────────────
    const zone   = document.getElementById('scratchZone');
    const canvas = document.getElementById('scratch-canvas');
    const ctx    = canvas.getContext('2d');
    let cookieImg  = null;
    let canvasReady = false;

    function drawCookieToCanvas() {
      const s = zone.offsetWidth;
      if (!s) return;
      canvas.width  = s;
      canvas.height = s;
      if (cookieImg) {
        ctx.drawImage(cookieImg, 0, 0, s, s);
      }
      canvasReady = true;
    }

    // Load the Coockie.svg image onto the scratch canvas
    const cookieSrc = new Image();
    cookieSrc.onload = function() {
      cookieImg = cookieSrc;
      drawCookieToCanvas();
      zone.style.opacity = '1';
    };
    cookieSrc.onerror = function() {
      drawCookieToCanvas();
      drawFallbackCookie(canvas.width);
      zone.style.opacity = '1';
    };
    cookieSrc.src = './assets/Coockie.svg';

    // Redraw on resize
    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(drawCookieToCanvas, 100);
    });

    // Programmatic fallback (if SVG can't load)
    function drawFallbackCookie(s) {
      const cx = s / 2, cy = s / 2;
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, s / 2, 0, Math.PI * 2);
      ctx.clip();
      const g = ctx.createRadialGradient(cx * 0.65, cy * 0.58, 0, cx, cy, s * 0.52);
      g.addColorStop(0, '#F5A726');
      g.addColorStop(0.42, '#E07318');
      g.addColorStop(1, '#B65210');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, s, s);
      ctx.font = `900 ${s * 0.127}px 'Helvetica Neue', Arial, sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle    = '#fff';
      ctx.shadowColor  = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur   = 12;
      ctx.fillText('Scratch me', cx, cy);
      ctx.restore();
    }

    // ── Scratch logic ──────────────────────────────────────────────────────────
    let painting       = false;
    let redirected     = false;
    let eraseCount     = 0;
    let tainted        = false;
    let lastCountedPos = null;
    const BRUSH          = () => canvas.width * 0.10;
    const THRESHOLD      = 0.60;
    const ERASE_FALLBACK = 60; // ~60s brush-width steps ≈ 60–70% coverage

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const sx   = canvas.width  / rect.width;
      const sy   = canvas.height / rect.height;
      const src  = e.touches ? e.touches[0] : e;
      return { x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy };
    }

    function erase(p) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(p.x, p.y, BRUSH(), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    function scratchedRatio() {
      try {
        const s    = canvas.width;
        const data = ctx.getImageData(0, 0, s, s).data;
        let inside = 0, clear = 0;
        const step = 5;
        for (let y = 0; y < s; y += step) {
          for (let x = 0; x < s; x += step) {
            const dx = x - s / 2, dy = y - s / 2;
            if (dx * dx + dy * dy > (s / 2) * (s / 2)) continue;
            inside++;
            if (data[(y * s + x) * 4 + 3] < 50) clear++;
          }
        }
        return inside ? clear / inside : 0;
      } catch (e) {
        tainted = true;
        return -1;
      }
    }

    function onScratch(e) {
      if (!painting || redirected) return;
      const p = pos(e);
      erase(p);

      // Count only once per brush-width of movement so mousemove rate doesn't matter
      const step = BRUSH() * 0.60;
      if (!lastCountedPos ||
          Math.hypot(p.x - lastCountedPos.x, p.y - lastCountedPos.y) >= step) {
        eraseCount++;
        lastCountedPos = p;
      }

      if (tainted) {
        if (eraseCount >= ERASE_FALLBACK) doRedirect();
      } else {
        const ratio = scratchedRatio();
        if (ratio < 0) {
          // canvas just became tainted — switch to count-based from here
        } else if (ratio >= THRESHOLD) {
          doRedirect();
        }
      }
    }

    function doRedirect() {
      redirected = true;
      document.getElementById('overlay').classList.add('active');
      setTimeout(function() {
        window.location.href = 'you-won.html?' + params.toString();
      }, 600);
    }

    canvas.addEventListener('mousedown',  function(e) { painting = true; lastCountedPos = null; erase(pos(e)); });
    canvas.addEventListener('mousemove',  onScratch);
    canvas.addEventListener('mouseup',    function() { painting = false; lastCountedPos = null; });
    canvas.addEventListener('mouseleave', function() { painting = false; lastCountedPos = null; });

    canvas.addEventListener('touchstart', function(e) { e.preventDefault(); painting = true; lastCountedPos = null; erase(pos(e)); }, { passive: false });
    canvas.addEventListener('touchmove',  function(e) { e.preventDefault(); onScratch(e); },                                          { passive: false });
    canvas.addEventListener('touchend',   function() { painting = false; lastCountedPos = null; });
  </script>

</body>
</html>
