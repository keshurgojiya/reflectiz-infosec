<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Prize Reserved – Royal Rubber Duck | Reflectiz</title>
  <script src="./assets/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(122.88deg, #103A77 26.52%, #FF6C87 115.97%);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #fff;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: "Noto Sans", sans-serif;
    }

    /* ── Page wrapper ── */
    .page-wrap {
      width: 100%;
      max-width: 1200px;
      padding: 48px 64px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Logo ── */
    .logo img {
      height: 68px;
      width: auto;
      display: block;
    }

    /* ── Two-column layout ── */
    .content {
      display: flex;
      align-items: flex-start;
      gap: 64px;
    }

    /* ── Left column ── */
    .left {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 39px;
    }

    .reserved-heading {
      font-size: 76px;
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -2px;
    }

    /* ── Prize card ── */
    .prize-card {
      background: #fff;
      border-radius: 20px;
      padding: 20px 20px 20px 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      width: 560px;
    }

    .prize-info { flex: 1; min-width: 0; }

    .prize-label {
      font-size: 20px;
      font-weight: 900;
      color: #1F4680;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .prize-name {
      font-size: 40px;
      font-weight: 900;
      color: #1F4680;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .booth-note {
      font-size: 20px;
      font-weight: 900;
      color: #1F4680;
      line-height: 1.55;
    }

    /* ── QR code ── */
    .qr-wrap { flex-shrink: 0; }
    #qrcode canvas, #qrcode img { border-radius: 8px; display: block; width: 193px; }
    .qr-fallback {
      width: 130px; height: 130px;
      border: 2px dashed #d1d5db; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #9ca3af; font-size: 11px; text-align: center; padding: 10px;
    }

    /* Mobile-only duck inside card */
    .prize-img-mobile { display: none; }

    /* ── Right column (desktop only) ── */
    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .right img {
      height: 320px;
      width: auto;
      object-fit: contain;
      display: block;
      margin-top: 45px;
    }

    /* ── Mobile ── */
    @media (max-width: 860px) {
      body { align-items: flex-start; }

      .page-wrap {
        padding: 28px 20px 48px;
        gap: 30px;
      }

      .logo img { height: 60px; }

      .content {
        flex-direction: column;
        align-items: stretch;
        gap: 20px;
      }

      .left {
        width: 100%;
        gap: 16px;
      }

      .reserved-heading {
        font-size: 40px;
        letter-spacing: -1px;
        margin-bottom: 30px;
      }

      .prize-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
        padding: 36px 34px 34px 34px;
        gap: 0;
        border-radius: 20px;
      }

      .prize-label {
        font-size: 20px;
        margin-bottom: 10px;
      }

      .prize-name {
        font-size: 40px;
        margin-bottom: 14px;
        padding: 0px 4px;
        line-height: 40px;
      }

      .booth-note {
        font-size: 17px;
        line-height: 20px;
        margin-bottom: 38px;
      }

      .qr-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 28px;
      }

      #qrcode canvas, #qrcode img {
        width: 100% !important;
        height: auto !important;
        max-width: 260px;
        border-radius: 10px;
      }

      .prize-img-mobile {
        display: block;
        width: 236px;
        height: auto;
        margin: 0 auto;
        padding-top: 20px;
      }

      .right { display: none; }
    }
  </style>
</head>
<body>

  <div class="page-wrap">

    

    <div class="content">

      <div class="left">

        <div class="logo">
          <img src="./assets/logos.svg" alt="Reflectiz × Infosecurity Europe">
        </div>

        <h1 class="reserved-heading">Prize reserved!</h1>

        <div class="prize-card">
          <div class="prize-info">
            <p class="prize-label">Your prize:</p>
            <p class="prize-name">Royal rubber duck</p>
            <p class="booth-note">Bring this QR code to Booth F115 to collect your prize</p>
          </div>

          <div class="qr-wrap">
            <div id="qrcode"></div>
          </div>

          <img class="prize-img-mobile" src="./assets/prize-duck.svg" alt="Royal Rubber Duck">
        </div>
      </div>

      <div class="right">
        <img src="./assets/prize-duck.svg" alt="Royal Rubber Duck">
      </div>

    </div>
  </div>

  <script>
    const params     = new URLSearchParams(window.location.search);
    const token      = params.get('token') || 'demo';
    const BASE_URL   = 'https://www.reflectiz.com/infosec2026';
    const checkinURL = `${BASE_URL}/checkin?token=${encodeURIComponent(token)}`;
    const isMobile   = window.innerWidth <= 860;
    const qrSize     = isMobile ? 240 : 130;

    try {
      new QRCode(document.getElementById('qrcode'), {
        text: checkinURL, width: qrSize, height: qrSize,
        colorDark: '#1c2875', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {
      document.getElementById('qrcode').innerHTML =
        `<div class="qr-fallback">QR code<br>token: ${token}</div>`;
    }
  </script>

</body>
</html>
